name: Windows installer

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать выпуск с версией из switcher/__init__.py и описанием из CHANGELOG.md"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[gui,dev]" pyinstaller

      - name: Unit tests
        run: python -m pytest -q

      - name: Release version and notes
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'import switcher; print(switcher.__version__)')"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match switcher.__version__ $version"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released: raise __version__ and add a CHANGELOG.md section"; exit 1
          fi
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          python tools/release_notes.py "$version" > release-notes.md
          cat release-notes.md

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: python packaging/windows/build.py

      - name: Install, start and uninstall
        shell: pwsh
        run: ./packaging/windows/check_install.ps1

      - name: Update and roll back from the app (end-to-end)
        env:
          SWITCHER_GITHUB_TOKEN: ${{ github.token }}
        run: python tools/windows_update_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: SwitcherSetup
          path: dist/SwitcherSetup-*.exe
          if-no-files-found: error

      - name: Settings window screenshots
        run: python tools/gui_screenshots.py screenshots --preview

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png

      - name: Typing into Notepad (end-to-end)
        shell: pwsh
        run: |
          $languages = Get-WinUserLanguageList
          $languages.Add("ru-RU")
          Set-WinUserLanguageList $languages -Force
          python tools/windows_smoke.py

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$RELEASE_TAG" dist/SwitcherSetup-*.exe
          --target "$GITHUB_SHA"
          --title "Switcher $RELEASE_VERSION"
          --notes-file release-notes.md
