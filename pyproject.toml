[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switcher-ru-en"
version = "0.1.0"
description = "Умный переключатель раскладки RU/EN, который учится на ваших исправлениях (с Claude внутри)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wordfreq>=3.1",
    "pynput>=1.8",
    "anthropic>=1.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
switcher = "switcher.cli:main"

[tool.setuptools.packages.find]
include = ["switcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
