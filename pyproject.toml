[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switcher-ru-en"
dynamic = ["version"]  # switcher/__init__.py
description = "Умный переключатель раскладки RU/EN, который учится на ваших исправлениях (с Claude внутри)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wordfreq>=3.1",
    "pynput>=1.8",
    "anthropic>=1.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2", "pystray>=0.19", "pillow>=10"]
tray = ["switcher-ru-en[gui]"]
dev = ["pytest>=8"]

[project.scripts]
switcher = "switcher.cli:main"

[tool.setuptools.dynamic]
version = {attr = "switcher.__version__"}

[tool.setuptools.packages.find]
include = ["switcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
